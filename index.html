<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кабинет переехал</title>
    <meta
      name="description"
      content="Личный кабинет переехал на cabinet.isitov.ru"
    />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Кабинет переехал" />
    <meta
      property="og:description"
      content="Откройте личный кабинет на новом адресе: cabinet.isitov.ru"
    />
    <meta name="theme-color" content="#007aff" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <style>
      :root {
        --bg: #f2f2f7;
        --text: #1c1c1e;
        --ink-soft: rgba(18, 20, 23, 0.76);
        --ink-faint: rgba(18, 20, 23, 0.45);
        --blue: #007aff;
        --glow-1: rgba(0, 122, 255, 0.14);
        --glow-2: rgba(124, 58, 237, 0.14);
        --font:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        min-height: 100dvh;
        position: relative;
        font-family: var(--font);
        color: var(--text);
        background: var(--bg);
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(1200px 1100px at 18% 8%, var(--glow-1), transparent 58%),
          radial-gradient(1000px 1000px at 84% 10%, var(--glow-2), transparent 58%);
      }

      .card {
        width: min(100%, 480px);
        text-align: center;
        animation: fadeUp 560ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .icon-wrap {
        width: min(100%, 280px);
        aspect-ratio: 936 / 552;
        margin: 0 auto 4px;
      }

      .icon-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        transform-origin: 50% 80%;
        animation: rock 3.2s ease-in-out infinite;
      }

      @keyframes rock {
        0%,
        100% {
          transform: rotate(-4deg);
        }
        50% {
          transform: rotate(4deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .icon-wrap img {
          animation: none;
        }
      }

      h1 {
        margin: 0 0 22px;
        font-size: clamp(28px, 5vw, 40px);
        font-weight: 750;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      .btn {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: 260px;
        min-height: 64px;
        padding: 12px 22px;
        border-radius: 14px;
        background: var(--blue);
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 8px 24px rgba(0, 122, 255, 0.28);
      }

      .btn:hover {
        filter: brightness(1.06);
      }

      .btn__timer {
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.78);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon-wrap" aria-hidden="true">
        <img src="./migrate-icon.png" alt="" width="280" height="165" />
      </div>
      <h1>Сайт переехал</h1>
      <a class="btn" id="goLink" href="https://cabinet.isitov.ru/">
        <span>Перейти на новую версию</span>
        <span class="btn__timer" id="countdown"></span>
      </a>
    </main>
    <script>
      (function () {
        var NEW_ORIGIN = "https://cabinet.isitov.ru";
        var DELAY_MS = 5000;

        var file = (location.pathname.split("/").pop() || "").toLowerCase();
        var path = file === "admin.html" ? "/admin.html" : "/";
        var next = NEW_ORIGIN + path + location.search + location.hash;

        var link = document.getElementById("goLink");
        var hint = document.getElementById("countdown");
        link.href = next;

        var left = Math.round(DELAY_MS / 1000);
        hint.textContent = "Переход через " + left + " с";

        var timer = setInterval(function () {
          left -= 1;
          if (left <= 0) {
            clearInterval(timer);
            location.replace(next);
            return;
          }
          hint.textContent = "Переход через " + left + " с";
        }, 1000);
      })();
    </script>
  </body>
</html>
